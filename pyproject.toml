[project]
name = "synology-mcp"
version = "0.1.0"
description = "Read-only Synology DSM MCP server - NAS health, storage, shares, snapshots, iSCSI, packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.1,<2",   # v1 API: server.py imports mcp.server.fastmcp, gone in mcp 2.x
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
